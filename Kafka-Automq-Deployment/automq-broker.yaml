apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: automq-broker
  namespace: automq
spec:
  replicas: 1
  serviceName: automq-broker-headless

  selector:
    matchLabels:
      app: automq-broker

  template:
    metadata:
      labels:
        app: automq-broker

    spec:
      containers:

        - name: broker

          image: automqinc/automq:latest

          command:
            - /bin/sh
            - -c
            - |
              NODE_ID=$((${HOSTNAME##*-} + 1))

              # Internal Kafka listener = 9092
              # External Kafka listener = 9094

              sed -i \
                's|setup_value "listeners" "PLAINTEXT://${local_private_ip}:9092" "${kafka_dir}/config/kraft/${process_role}.properties"|setup_value "listeners" "PLAINTEXT://${local_private_ip}:9092,EXTERNAL://0.0.0.0:9094" "${kafka_dir}/config/kraft/${process_role}.properties"|' \
                /opt/kafka/scripts/start.sh

              sed -i \
                's|setup_value "advertised.listeners" "PLAINTEXT://${advertised_ip}:9092" "${kafka_dir}/config/kraft/${process_role}.properties"|setup_value "advertised.listeners" "PLAINTEXT://${advertised_ip}:9092,EXTERNAL://192.168.10.70:30094" "${kafka_dir}/config/kraft/${process_role}.properties"|' \
                /opt/kafka/scripts/start.sh

              exec /opt/kafka/scripts/start.sh up \
                --process.roles broker \
                --node.id $NODE_ID \
                --controller.quorum.voters 0@automq-controller.automq.svc:9093 \
                --s3.endpoint http://192.168.10.71:7480 \
                --s3.region us-east-1 \
                --s3.bucket automq-data \
                --cluster.id rZdE0DjZSrqy96PXrMUZVw \
                --s3.access.key $KAFKA_S3_ACCESS_KEY \
                --s3.secret.key $KAFKA_S3_SECRET_KEY

          env:

            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx1g"

            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_CFG_AUTHORIZER_CLASS_NAME
              value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"

            - name: KAFKA_CFG_SUPER_USERS
              value: "User:ANONYMOUS"

            - name: KAFKA_CFG_S3_WAL_PATH
              value: "0@s3://automq-wal?region=us-east-1&endpoint=http://192.168.10.71:7480&authType=static"

            - name: KAFKA_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: automq-s3-credentials
                  key: access_key

            - name: KAFKA_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: automq-s3-credentials
                  key: secret_key

          ports:

            - containerPort: 9092
              name: kafka

            - containerPort: 9094
              name: kafka-ext

          resources:

            requests:
              cpu: 250m
              memory: 1Gi

            limits:
              cpu: "1"
              memory: 2Gi

---
# ============================================================
# Headless service
# Used internally by StatefulSet/Kubernetes
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: automq-broker-headless
  namespace: automq

spec:

  clusterIP: None

  selector:
    app: automq-broker

  ports:

    - name: kafka
      port: 9092
      targetPort: 9092

    - name: kafka-ext
      port: 9094
      targetPort: 9094

---
# ============================================================
# Broker service
#
# Internal:
#   automq-broker.automq.svc.cluster.local:9092
#
# External NodePorts:
#   9092 -> 32002
#   9094 -> 30094
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: automq-broker
  namespace: automq

spec:

  type: NodePort

  selector:
    app: automq-broker

  ports:

    - name: kafka
      port: 9092
      targetPort: 9092
      nodePort: 32002

    - name: kafka-ext
      port: 9094
      targetPort: 9094
      nodePort: 30094
